<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Experiencia interactiva de Enrútate activada mediante clics.">
  <title>Enrútate — Exploración</title>
  <link rel="stylesheet" href="exploracion.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <symbol id="icon-nut" viewBox="0 0 64.45 74.09">
      <path fill="currentColor" d="M43.33,6.98h-25.38L0,24.93v25.38l17.95,17.95h25.38l17.95-17.95v-25.38L43.33,6.98ZM39.19,46.16c-4.73,4.72-12.37,4.72-17.07,0-4.73-4.72-4.73-12.36,0-17.07,4.71-4.72,12.36-4.73,17.07,0,4.72,4.71,4.71,12.36,0,17.07Z"/>
    </symbol>
  </svg>

  <header class="hud" aria-label="Navegación de la experiencia">
    <a class="hud-home" href="index.html">ENRÚTATE</a>

    <div class="hud-route" aria-label="Progreso">
      <span class="hud-step is-active" data-step="red">
        <svg viewBox="0 0 64.45 74.09"><use href="#icon-nut"></use></svg>
      </span>
      <span class="hud-dots"></span>
      <span class="hud-step" data-step="blue">
        <svg viewBox="0 0 64.45 74.09"><use href="#icon-nut"></use></svg>
      </span>
      <span class="hud-dots"></span>
      <span class="hud-step" data-step="green">
        <svg viewBox="0 0 64.45 74.09"><use href="#icon-nut"></use></svg>
      </span>
    </div>

    <a class="hud-info" href="https://wiki.ead.pucv.cl/Enr%C3%BAtate" target="_blank" rel="noreferrer">WIKI</a>
  </header>

  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <main class="experience">
    <section class="scene" id="scene" aria-label="Recorrido interactivo de Enrútate">
      <div class="pattern pattern-left" aria-hidden="true"></div>
      <div class="pattern pattern-right" aria-hidden="true"></div>

      <div class="yellow-wash" id="yellowWash" aria-hidden="true"></div>
      <div class="red-field" id="redField" aria-hidden="true"></div>
      <div class="red-close" id="redClose" aria-hidden="true"></div>

      <div class="intro" id="intro">
        <button class="pawn-button" id="pawnButton" type="button" aria-label="Comenzar recorrido">
          <img src="assets/inicio-09.svg" alt="Peón de Enrútate">
        </button>

        <div class="chapter-copy">
          <p>HAZ CLIC EN EL PEÓN</p>
          <h1>TODO<br>RECORRIDO<br>COMIENZA AQUÍ</h1>
        </div>
      </div>

      <div class="route-stage" id="routeStage" aria-hidden="true">
        <div class="orbit-line" aria-hidden="true"></div>

        <div class="route-pawn" aria-hidden="true">
          <img src="assets/inicio-09.svg" alt="">
        </div>

        <div class="nut-ring" id="nutRing" aria-label="Piezas del recorrido"></div>

        <p class="route-instruction" id="routeInstruction">HAZ CLIC EN UNA PIEZA NEGRA</p>
      </div>

      <div class="transition-layer" id="transitionLayer" aria-hidden="true">
        <button class="focus-piece focus-red" id="focusRed" type="button" tabindex="-1" aria-hidden="true">
          <img src="tuerca-04.png" alt="">
        </button>

        <button class="focus-piece focus-blue" id="focusBlue" type="button" tabindex="-1" aria-hidden="true">
          <img src="tuerca-03.png" alt="">
        </button>

        <button class="focus-piece focus-green" id="focusGreen" type="button" tabindex="-1" aria-hidden="true">
          <img src="tuerca-05.png" alt="">
        </button>

        <div class="blue-system" id="blueSystem" aria-hidden="true">
          <div class="blue-ring-main"><span class="blue-marker"></span></div>
          <div class="blue-ring-segmented"></div>
        </div>

        <section class="blue-game" id="blueGame" aria-hidden="true">
          <p class="blue-game-label" id="blueGameInstruction">HAZ CLIC PARA UNIR LAS PIEZAS</p>

          <button class="blue-orbit-wheel" id="blueOrbitWheel" type="button" aria-label="Unir las piezas azules">
            <span class="blue-orbit-piece"><svg viewBox="0 0 64.45 74.09" aria-hidden="true"><use href="#icon-nut"></use></svg></span>
            <span class="blue-orbit-piece"><svg viewBox="0 0 64.45 74.09" aria-hidden="true"><use href="#icon-nut"></use></svg></span>
            <span class="blue-orbit-piece"><svg viewBox="0 0 64.45 74.09" aria-hidden="true"><use href="#icon-nut"></use></svg></span>
            <span class="blue-orbit-piece"><svg viewBox="0 0 64.45 74.09" aria-hidden="true"><use href="#icon-nut"></use></svg></span>
            <span class="blue-orbit-piece"><svg viewBox="0 0 64.45 74.09" aria-hidden="true"><use href="#icon-nut"></use></svg></span>
            <span class="blue-orbit-piece"><svg viewBox="0 0 64.45 74.09" aria-hidden="true"><use href="#icon-nut"></use></svg></span>
          </button>

          <button class="blue-break-piece" id="blueBreakPiece" type="button" aria-label="Desarmar la pieza azul">
            <svg viewBox="0 0 200 200" role="img" aria-label="Pieza azul dividida en fragmentos">
              <polygon class="blue-fragment" data-fragment="0" points="68.6,24.2 131.4,24.2 114.5,64.9 85.5,64.9"/>
              <polygon class="blue-fragment" data-fragment="1" points="131.4,24.2 175.8,68.6 135.1,85.5 114.5,64.9"/>
              <polygon class="blue-fragment" data-fragment="2" points="175.8,68.6 175.8,131.4 135.1,114.5 135.1,85.5"/>
              <polygon class="blue-fragment" data-fragment="3" points="175.8,131.4 131.4,175.8 114.5,135.1 135.1,114.5"/>
              <polygon class="blue-fragment" data-fragment="4" points="131.4,175.8 68.6,175.8 85.5,135.1 114.5,135.1"/>
              <polygon class="blue-fragment" data-fragment="5" points="68.6,175.8 24.2,131.4 64.9,114.5 85.5,135.1"/>
              <polygon class="blue-fragment" data-fragment="6" points="24.2,131.4 24.2,68.6 64.9,85.5 64.9,114.5"/>
              <polygon class="blue-fragment" data-fragment="7" points="24.2,68.6 68.6,24.2 85.5,64.9 64.9,85.5"/>
              <circle class="blue-core" cx="100" cy="100" r="31"/>
            </svg>
          </button>

          <p class="blue-counter" id="blueCounter" aria-live="polite"></p>
        </section>

        <div class="yellow-emblem" id="yellowEmblem" aria-hidden="true">
          <svg viewBox="0 0 122.48 118.66">
            <path d="M90.44,46c-4.33-1.41-8.65-2.81-12.98-4.22-1.41-4.33-2.81-8.65-4.22-12.98-4.06,2.06-8.11,4.13-12.17,6.19-4.05-2.06-8.11-4.13-12.17-6.19-1.41,4.33-2.81,8.65-4.22,12.98-4.33,1.41-8.65,2.81-12.98,4.22,2.06,4.05,4.13,8.11,6.19,12.16-2.06,4.05-4.13,8.11-6.19,12.16,4.33,1.41,8.65,2.81,12.98,4.22,1.41,4.33,2.81,8.65,4.22,12.98,4.06-2.06,8.11-4.13,12.17-6.19,4.06,2.06,8.11,4.13,12.17,6.19,1.41-4.33,2.81-8.65,4.22-12.98,4.33-1.41,8.65-2.81,12.98-4.22-2.06-4.05-4.13-8.11-6.19-12.16,2.06-4.05,4.13-8.11,6.19-12.16ZM69.62,66.7c-4.73,4.72-12.36,4.72-17.07,0-4.73-4.72-4.73-12.35,0-17.07,4.71-4.72,12.35-4.73,17.07,0,4.72,4.71,4.71,12.35,0,17.07Z"/>
            <path d="M81.48,8.91h-40.8s-28.85,28.85-28.85,28.85v40.8l28.85,28.85h40.8s28.85-28.85,28.85-28.85v-40.8s-28.85-28.85-28.85-28.85ZM93.75,71.7l-14.44,4.7-4.7,14.44-13.53-6.89-13.53,6.89-4.7-14.44-14.44-4.7,6.89-13.53-6.89-13.53,14.44-4.7,4.7-14.44,13.53,6.89,13.53-6.89,4.7,14.44,14.44,4.7-6.89,13.53,6.89,13.53Z"/>
          </svg>
        </div>
      </div>

      <section class="outro" id="outro" aria-hidden="true">
        <p>ELIGE TU RUTA</p>
        <h2>AVANZA · MUÉVETE · ARRIESGA</h2>
        <div class="outro-actions">
          <a href="index.html">VOLVER AL INICIO</a>
          <button type="button" id="restartButton">REPETIR RECORRIDO</button>
        </div>
      </section>
    </section>
  </main>

  <script src="exploracion.js"></script>
</body>
</html>
